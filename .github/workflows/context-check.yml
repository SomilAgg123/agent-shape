name: Context maintenance checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - name: Check context and ASD-STE100 sentence limits
        run: |
          mkdir -p "$RUNNER_TEMP/review-input"
          python scripts/pr_maintenance.py context --output "$RUNNER_TEMP/review-input/request.json" --prompt "$RUNNER_TEMP/review-input/prompt.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-review-request-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/review-input/
          if-no-files-found: error
          retention-days: 14
