name: Software validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Harness self-tests
        run: python -m pytest tests/harness -q
      - name: Install pinned Bend (add-on)
        if: hashFiles('.bend-version') != ''
        run: python scripts/install_bend.py --destination "$RUNNER_TEMP/bend"
      - name: Check Bend proofs (add-on)
        if: hashFiles('.bend-version') != ''
        run: |
          "$BEND_EXECUTABLE" guide
          python scripts/check_bend.py
      # PROJECT CHECKS: replace with your stack's lint, type, test and build commands.
      - name: Project tests
        run: python -m pytest -q
