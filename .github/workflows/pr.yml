name: PR maintenance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-maintenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validation:
    uses: ./.github/workflows/validate.yml

  context:
    uses: ./.github/workflows/context-check.yml

  gate:
    name: PR maintenance gate
    if: ${{ always() }}
    needs: [validation, context]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/harness/pr_maintenance.py gate
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULTS: '{"validation":"${{ needs.validation.result }}","context":"${{ needs.context.result }}"}'
